worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    # Pure round-robin across the two API instances (no business logic here).
    upstream api {
        server api1:9999;
        server api2:9999;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
