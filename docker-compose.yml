# Rinha de Backend 2026 - zoio nas fraudes
# Constraints: load balancer + 2 API instances, total <= 1 CPU and <= 350MB, bridge network.
# Budget:  nginx 0.10 CPU / 30MB  +  api1 0.45 CPU / 160MB  +  api2 0.45 CPU / 160MB
#          = 1.00 CPU / 350MB

x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  # For submission this must be a public image, e.g.:
  # image: boaglio/zoio-rinha2026:latest
  expose:
    - "9999"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api1:
    <<: *api
    hostname: api1

  api2:
    <<: *api
    hostname: api2

  lb:
    image: nginx:1.27-alpine
    container_name: lb
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
